services:
  - type: web
    name: reviewcrew-app
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reviewcrew-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reviewcrew-redis
          property: port
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini

  - type: redis
    name: reviewcrew-redis
    plan: free
    ipAllowList: []
